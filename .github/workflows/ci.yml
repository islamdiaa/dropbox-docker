name: Build and Publish

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 4 1 * *'
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request supersedes its running build
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOCKER_IMAGE_NAME: dropbox-docker
  TEST_IMAGE: dropbox-test:e2e

# Third-party actions are pinned to commit SHAs: tags can be moved, as
# happened to aquasecurity/trivy-action in March 2026. Dependabot keeps the
# pins and their version comments up to date.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile

      - name: ShellCheck scripts
        run: shellcheck -x docker-entrypoint.sh healthcheck.sh tests/run_tests.sh tests/e2e/*.sh

      - name: Lint workflows
        run: |
          docker run --rm -v "$PWD:/repo" --workdir /repo \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Run unit tests
        run: |
          pip install -r tests/requirements-test.txt
          pytest tests/unit/ -v --tb=short --cov=monitoring --cov-report=term-missing

  # Build, test and scan the image before anything is published, on pull
  # requests too, so a broken or vulnerable image never reaches users.
  build-test-publish:
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      release_version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # A release is a vX.Y.Z tag push, or a push to main whose CHANGELOG.md
      # starts with a version that has no tag yet. Either way the image is
      # also published as X.Y.Z and X.Y, and the release job tags it.
      - name: Detect release
        id: release
        if: github.event_name == 'push' || github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            # The X.Y tag is derived from this, so v1.5.0-rc1 would overwrite 1.5
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Tag $GITHUB_REF_NAME is not vX.Y.Z; refusing to publish it as a release"
              exit 1
            fi
          elif [[ "$GITHUB_REF" == refs/heads/main ]]; then
            version=$(grep -m1 -oP '^## \K[0-9]+\.[0-9]+\.[0-9]+(?= — )' CHANGELOG.md || true)
            if [ -n "$version" ]; then
              # Exit 0: tag exists, already released. Exit 2: no such tag.
              # Anything else (network, outage) must not look like "no tag",
              # or unreleased code would be published under a released version.
              rc=0
              git ls-remote --exit-code --tags "https://github.com/$GITHUB_REPOSITORY" "refs/tags/v$version" > /dev/null || rc=$?
              case "$rc" in
                0) version="" ;;
                2) ;;
                *) echo "::error::Could not check whether v$version is already released (git ls-remote exit $rc)"; exit 1 ;;
              esac
            fi
          fi
          # The monthly rebuild also moves `latest`, `stable` and the newest
          # release's X.Y tag, so those users get Ubuntu's security updates. Only when
          # nothing that goes into the image changed since that release:
          # release tags must never carry unreleased code. X.Y.Z is never moved.
          rebuild_minor=""
          if [[ "$GITHUB_EVENT_NAME" == schedule ]]; then
            released=$(grep -m1 -oP '^## \K[0-9]+\.[0-9]+\.[0-9]+(?= — )' CHANGELOG.md || true)
            if [ -n "$released" ] \
               && git fetch --quiet --depth=1 "https://github.com/$GITHUB_REPOSITORY" "refs/tags/v$released:refs/tags/v$released" \
               && git diff --quiet "v$released" HEAD -- Dockerfile docker-entrypoint.sh healthcheck.sh monitoring.py requirements.txt webui; then
              rebuild_minor="${released%.*}"
            fi
          fi
          echo "Release version: ${version:-none}"
          echo "Rebuilt minor tag: ${rebuild_minor:-none}"
          {
            echo "version=$version"
            echo "minor=${version%.*}"
            echo "rebuild_minor=$rebuild_minor"
          } >> "$GITHUB_OUTPUT"

      # Channels: `latest` and `stable` are always the newest release (moved
      # by a release, and by the monthly rebuild while main has no unreleased
      # image changes). `development` is every push to main.
      - name: Docker meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: |
            islamdiaa/${{ env.DOCKER_IMAGE_NAME }}
            ghcr.io/${{ github.repository_owner }}/${{ env.DOCKER_IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ steps.release.outputs.version != '' || steps.release.outputs.rebuild_minor != '' }}
            type=raw,value=stable,enable=${{ steps.release.outputs.version != '' || steps.release.outputs.rebuild_minor != '' }}
            type=raw,value=development,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}
            type=raw,value=${{ steps.release.outputs.version }},priority=900,enable=${{ steps.release.outputs.version != '' }}
            type=raw,value=${{ steps.release.outputs.minor }},enable=${{ steps.release.outputs.version != '' }}
            type=raw,value=${{ steps.release.outputs.rebuild_minor }},enable=${{ steps.release.outputs.rebuild_minor != '' }}
            type=sha,enable=true,priority=100,prefix=,suffix=,format=short
            type=schedule,pattern={{date 'YYYYMMDD'}}
          flavor: |
            latest=false

      # The image built here is the one that gets tested, scanned and then
      # published: no second build, so nothing untested can reach users.
      # The monthly scheduled build skips the layer cache so it picks up the
      # latest Ubuntu security updates instead of reusing old apt layers.
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            VERSION=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.version'] }}
            VCS_REF=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.revision'] }}
          tags: ${{ env.TEST_IMAGE }}

      - name: Run E2E tests
        run: |
          for test in tests/e2e/test_*.sh; do
            # The image was built above
            [ "$test" = tests/e2e/test_build.sh ] && continue
            echo "::group::$test"
            bash "$test"
            echo "::endgroup::"
          done

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: ${{ env.TEST_IMAGE }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the tested image
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker tag "$TEST_IMAGE" "$tag"
            docker push "$tag"
          done <<< "$TAGS"

  # Tag the release (unless it was a tag push) and create a GitHub release
  # whose notes are that version's CHANGELOG.md section.
  release:
    needs: build-test-publish
    if: needs.build-test-publish.outputs.release_version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build-test-publish.outputs.release_version }}
        run: |
          version="$VERSION"
          awk -v v="$version" 'index($0, "## " v " ") == 1 {found=1; next} found && /^## / {exit} found' \
            CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
          # Creates the v$version tag on this commit unless it already exists
          gh release create "v$version" --repo "$GITHUB_REPOSITORY" --title "v$version" \
            --notes-file release-notes.md --target "$GITHUB_SHA"

  # Scheduled builds have no one watching them; open (or update) an issue so
  # a failure gets noticed instead of going unseen for months.
  report-scheduled-failure:
    needs: [lint, build-test-publish]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Scheduled image build failed"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" \
              --body "The scheduled build failed again: $RUN_URL"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" \
              --body "The monthly scheduled build failed, so no updated image was published: $RUN_URL"
          fi
