name: Build and Publish

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 4 1 * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  DOCKER_IMAGE_NAME: dropbox-docker
  TEST_IMAGE: dropbox-test:e2e

# Third-party actions are pinned to commit SHAs: tags can be moved, as
# happened to aquasecurity/trivy-action in March 2026. Dependabot keeps the
# pins and their version comments up to date.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        with:
          dockerfile: Dockerfile

      - name: ShellCheck scripts
        run: shellcheck -x docker-entrypoint.sh tests/run_tests.sh tests/e2e/*.sh

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Run unit tests
        run: |
          pip install -r tests/requirements-test.txt
          pytest tests/unit/ -v --tb=short

  # Build, test and scan the image before anything is published, on pull
  # requests too, so a broken or vulnerable image never reaches users.
  build-test-publish:
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The monthly scheduled build skips the layer cache so it picks up the
      # latest Ubuntu security updates instead of reusing old apt layers.
      - name: Build test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ env.TEST_IMAGE }}

      - name: Run E2E tests
        run: |
          for test in tests/e2e/test_*.sh; do
            # The image was built above
            [ "$test" = tests/e2e/test_build.sh ] && continue
            echo "::group::$test"
            bash "$test"
            echo "::endgroup::"
          done

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: ${{ env.TEST_IMAGE }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        id: meta
        with:
          images: |
            islamdiaa/${{ env.DOCKER_IMAGE_NAME }}
            ghcr.io/${{ github.repository_owner }}/${{ env.DOCKER_IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}
            type=ref,event=tag
            type=sha,enable=true,priority=100,prefix=,suffix=,format=short
            type=schedule,pattern={{date 'YYYYMMDD'}}
          flavor: |
            latest=false

      # Reuses the layers built and tested above via the build cache
      - name: Publish image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          push: true
          context: .
          file: Dockerfile
          platforms: linux/amd64
          cache-from: type=gha
          build-args: |
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            VERSION=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.version'] }}
            VCS_REF=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.revision'] }}
          tags: ${{ steps.meta.outputs.tags }}

  # Scheduled builds have no one watching them; open (or update) an issue so
  # a failure gets noticed instead of going unseen for months.
  report-scheduled-failure:
    needs: [lint, build-test-publish]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Scheduled image build failed"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" \
              --body "The scheduled build failed again: $RUN_URL"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" \
              --body "The monthly scheduled build failed, so no updated image was published: $RUN_URL"
          fi
