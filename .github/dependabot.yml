version: 2
updates:

  # The Ubuntu base image is deliberately not managed here: the only
  # candidate tags are newer releases (interim ones like 24.10 go end of
  # life within months), and moving LTS needs a tested change. Patches for
  # 24.04 arrive through the monthly scheduled build, which pulls the base
  # image fresh and skips the layer cache.

  # Maintain dependencies for GitHub Actions, grouped into a single PR
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  # Python packages: requirements.txt (image) and tests/requirements-test.txt
  - package-ecosystem: pip
    directories: ["/", "/tests"]
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
